<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="明細集計">
<meta name="theme-color" content="#f5f3ee">
<title>カード明細 個人別集計</title>
<style>
  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --surface2: #eeece6;
    --border: #dedad1;
    --text: #1a1814;
    --text2: #6b6760;
    --text3: #9e9b95;
    --accent1: #2d6a4f;
    --accent1bg: #e8f5ee;
    --accent1border: #a8d5bb;
    --green: #2d6a4f;
    --radius: 14px;
    --radius-sm: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    max-width: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', sans-serif;
    display: flex;
    flex-direction: column;
    overscroll-behavior-x: none;
    touch-action: pan-y;
  }

  header {
    flex-shrink: 0;
    background: rgba(245, 243, 238, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
  header p  { font-size: 12px; color: var(--text3); margin-top: 1px; }

  main {
    flex: 1;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 14px 16px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
  }

  /* ── Drop zone (shown when no data) ── */
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
  }
  #dropzone.drag-over { border-color: var(--accent1); background: var(--accent1bg); }
  #dropzone.hidden { display: none; }
  #dropzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .dropzone-icon { font-size: 36px; margin-bottom: 10px; }
  #dropzone h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  #dropzone p  { font-size: 12px; color: var(--text3); line-height: 1.5; }
  .btn-label {
    display: inline-block;
    margin-top: 14px;
    background: var(--text);
    color: var(--bg);
    padding: 8px 22px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
  }

  /* ── App (shown when data loaded) ── */
  #app {
    flex: 1;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    touch-action: pan-y;
    display: none;          /* shown via JS */
    flex-direction: column;
  }
  #app.visible { display: flex; }

  /* Month tabs */
  .month-tabs {
    flex-shrink: 0;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 10px;
    scrollbar-width: none;
  }
  .month-tabs::-webkit-scrollbar { display: none; }
  .month-tab {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text2);
    cursor: pointer;
    transition: all 0.15s;
  }
  .month-tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }

  /* Filters and view switcher */
  .toolbar {
    flex-shrink: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .toolbar input {
    min-height: 34px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    padding: 6px 10px;
    font: inherit;
    font-size: 12px;
  }
  .toolbar input { flex: 1 1 180px; min-width: 140px; }
  .sort-menu { position: relative; flex: 0 0 184px; }
  .sort-trigger {
    width: 100%;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    padding: 6px 10px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .sort-trigger:hover, .sort-menu.open .sort-trigger {
    border-color: var(--accent1border);
    box-shadow: 0 0 0 3px var(--accent1bg);
  }
  .sort-trigger-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sort-trigger-icon { color: var(--text3); font-size: 15px; line-height: 1; transition: transform .15s; }
  .sort-menu.open .sort-trigger-icon { transform: rotate(180deg); }
  .sort-options {
    position: absolute;
    z-index: 20;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    display: none;
    padding: 5px;
    background: rgba(255,255,255,.98);
    border: 1px solid var(--border);
    border-radius: 11px;
    box-shadow: 0 12px 28px rgba(26,24,20,.14), 0 2px 5px rgba(26,24,20,.08);
  }
  .sort-menu.open .sort-options { display: grid; gap: 2px; }
  .sort-option {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--text2);
    padding: 8px 9px;
    font: inherit;
    font-size: 12px;
    text-align: left;
    cursor: pointer;
  }
  .sort-option:hover { background: var(--surface2); color: var(--text); }
  .sort-option.selected { background: var(--accent1bg); color: var(--accent1); font-weight: 600; }
  .sort-option-check { font-size: 13px; }
  .view-tabs { display: flex; gap: 5px; }
  .view-tab {
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text2);
    padding: 7px 11px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .view-tab.active { background: var(--text); border-color: var(--text); color: var(--bg); }
  .period-filter {
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 1 auto;
    color: var(--text3);
    font-size: 11px;
  }
  .period-filter select {
    min-height: 34px;
    max-width: 112px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text2);
    padding: 6px 8px;
    font: inherit;
    font-size: 12px;
  }

  /* All-period analysis */
  .analysis-view { display: none; flex: 1; width: 100%; min-width: 0; max-width: 100%; min-height: 0; overflow-x: hidden; overflow-y: auto; }
  .analysis-view.active { display: block; }
  .analysis-summary {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    min-width: 0;
    width: 100%;
    gap: 10px;
    margin-bottom: 12px;
  }
  .metric-card, .analysis-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    min-width: 0;
    max-width: 100%;
  }
  .metric-label { color: var(--text3); font-size: 11px; margin-bottom: 5px; }
  .metric-value { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; overflow-wrap: anywhere; }
  .analysis-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-width: 0; width: 100%; gap: 12px; }
  .analysis-card { min-width: 0; overflow: hidden; }
  .analysis-card h2 { font-size: 14px; margin-bottom: 12px; }
  .analysis-card-wide { grid-column: 1 / -1; }
  .ranking-list { display: grid; gap: 8px; }
  .ranking-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; align-items: center; gap: 8px; font-size: 12px; }
  .ranking-rank { color: var(--text3); font-size: 11px; text-align: center; }
  .ranking-main { min-width: 0; }
  .ranking-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ranking-bar-track { height: 5px; margin-top: 5px; border-radius: 9px; background: var(--surface2); overflow: hidden; }
  .ranking-bar-fill { height: 100%; border-radius: inherit; background: var(--accent1); }
  .ranking-amount { font-weight: 600; white-space: nowrap; }
  .comparison-table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px; }
  .comparison-table th, .comparison-table td { padding: 8px 5px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .comparison-table th:first-child, .comparison-table td:first-child { text-align: left; }
  .comparison-up { color: #9a3b2f; }
  .comparison-down { color: var(--green); }
  .settlement-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .settlement-table th, .settlement-table td { padding: 8px 5px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  .settlement-table th:first-child, .settlement-table td:first-child { text-align: left; }
  .bar-chart { display: flex; align-items: flex-end; gap: 8px; height: 180px; overflow: hidden; padding-top: 14px; }
  .bar-column { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 5px; }
  .bar-value { font-size: 10px; color: var(--text2); white-space: nowrap; }
  .bar { width: 28px; min-height: 3px; border-radius: 6px 6px 2px 2px; background: var(--accent1); }
  .bar-label { font-size: 10px; color: var(--text3); white-space: nowrap; }
  .trend-table { width: 100%; max-width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px; }
  .trend-table th, .trend-table td { overflow: hidden; text-overflow: ellipsis; padding: 8px 4px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  .trend-table th:first-child, .trend-table td:first-child { text-align: left; }
  .trend-table th { color: var(--text3); font-weight: 500; }
  .empty-state { color: var(--text3); font-size: 13px; text-align: center; padding: 30px 12px; }
  .status-message { flex-shrink: 0; color: var(--text2); font-size: 12px; padding: 2px 2px 8px; }

  /* Month view */
  .month-view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  .month-view.active { display: flex; }

  /* Total banner */
  .total-banner {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 12px;
  }
  .grand-total {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .grand-total-label {
    font-size: 13px;
    color: var(--text2);
    font-weight: 600;
  }
  .grand-total-amount {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    white-space: nowrap;
  }
  .total-banner-label {
    font-size: 11px;
    color: var(--text3);
    font-weight: 500;
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .total-banner-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 8px;
  }
  .total-chip { border-radius: var(--radius-sm); padding: 10px 12px; }
  .total-chip-name  { font-size: 11px; font-weight: 500; margin-bottom: 3px; opacity: 0.75; }
  .total-chip-amount { font-size: 18px; font-weight: 700; letter-spacing: -0.03em; }

  /* Person cards grid — fills remaining height */
  .person-cards-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 12px;
    align-items: stretch;
  }

  /* Person card — stretches to fill grid cell */
  .person-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .person-header {
    flex-shrink: 0;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;

  }
  .person-header-left { display: flex; align-items: center; gap: 10px; }
  .person-avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .person-name  { font-size: 14px; font-weight: 600; }
  .person-count { font-size: 11px; color: var(--text3); margin-top: 1px; }
  .person-total { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }

  /* Transaction list — always open */
  .tx-list {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .tx-list-inner {
    border-top: 1px solid var(--border);
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tx-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }
  .tx-row:last-child { border-bottom: none; }
  .tx-store {
    font-size: 13px;
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tx-date   { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .tx-amount { font-size: 13px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .tx-amount.negative { color: var(--green); }

  /* Footer bar */
  .header-bar {
    display: flex;
    gap: 6px;
  }
  .header-btn {
    padding: 5px 11px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 100px;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    font-family: inherit;
    white-space: nowrap;
  }
  .header-btn:active { background: var(--surface2); }

  /* ── Mobile: tap a total-chip to show only that person's transactions ── */
  @media (max-width: 768px) {
    main { padding-left: 12px; padding-right: 12px; }
    .toolbar { gap: 6px; }
    .toolbar input { flex-basis: 100%; }
    .sort-menu { flex: 1; min-width: 0; }
    .period-filter { flex: 1 1 100%; }
    .period-filter select { flex: 1; max-width: none; min-width: 0; }
    .view-tabs { flex: 1; }
    .view-tab { flex: 1; }
    .analysis-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
    .metric-card { padding: 10px; }
    .metric-value { font-size: 16px; }
    .analysis-grid { grid-template-columns: minmax(0, 1fr); }
    .total-chip {
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.15s, transform 0.1s;
    }
    .total-chip.selected { opacity: 1; }
    .total-chip:active { transform: scale(0.97); }
    .total-banner-label { display: flex; align-items: center; gap: 4px; }
    .total-banner-label::after { content: "（タップで明細を切り替え）"; font-weight: 400; opacity: 0.8; }

    .person-cards-grid {
      display: flex;
      flex-direction: column;
    }
    .person-card { display: none; }
    .person-card.selected { display: flex; flex: 1; min-height: 0; }
  }
</style>
</head>
<body>

<header style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
  <div>
    <h1>💳 カード明細集計</h1>
    <p>CSVを読み込むと個人別に自動集計</p>
  </div>
  <div id="header-buttons" class="header-bar" style="display:none;">
    <button class="header-btn" onclick="document.getElementById('fileInput2').click()">📂 追加<input type="file" id="fileInput2" accept=".csv" multiple style="display:none" onchange="handleFiles(this.files)"></button>
    <button class="header-btn" onclick="resetAll()">🗑 クリア</button>
  </div>
</header>

<main>
  <div id="dropzone">
    <input type="file" id="fileInput" accept=".csv" multiple>
    <span class="dropzone-icon">📂</span>
    <h2>明細CSVを選択</h2>
    <p>複数月まとめて選べます<br>（202606.csv, 202607.csv など）</p>
    <span class="btn-label">ファイルを選ぶ</span>
  </div>

  <div id="app"></div>
</main>

<script>
const COLORS = [
  { bg:'#e8f5ee', text:'#2d6a4f', border:'#a8d5bb', avatarBg:'#2d6a4f', avatarText:'#e8f5ee' },
  { bg:'#eeecfb', text:'#4a3580', border:'#c5bef0', avatarBg:'#4a3580', avatarText:'#eeecfb' },
  { bg:'#fdf0e3', text:'#7a4010', border:'#f5c98a', avatarBg:'#7a4010', avatarText:'#fdf0e3' },
  { bg:'#fceef3', text:'#8b1a3a', border:'#f0adc6', avatarBg:'#8b1a3a', avatarText:'#fceef3' },
];

function decodeFile(buf) {
  for (const enc of ['shift-jis','utf-8','euc-jp']) {
    try {
      const t = new TextDecoder(enc,{fatal:true}).decode(buf);
      if (t.includes('ご利用')||t.includes('確定')) return t;
    } catch(e){}
  }
  return new TextDecoder('shift-jis').decode(buf);
}

function parseCSVText(text) {
  return text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').map(line => {
    const cols=[]; let cur='', inQ=false;
    for (let i=0;i<line.length;i++) {
      const c=line[i];
      if (c==='"') { if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ; }
      else if (c===','&&!inQ) { cols.push(cur.trim());cur=''; }
      else cur+=c;
    }
    cols.push(cur.trim()); return cols;
  });
}

function parseMonth(fn) {
  const m=fn.match(/(\d{4})(\d{2})/);
  return m?`${m[1]}年${parseInt(m[2])}月`:fn.replace('.csv','');
}
function parseAmt(s) {
  const n=parseInt(String(s||'').replace(/[,\s]/g,''),10);
  return isNaN(n)?NaN:n;
}
function processCSV(text,fn) {
  const rows=parseCSVText(text); if(rows.length<2) return null;
  const h=rows[0];
  const si=h.findIndex(x=>x.includes('ご利用店名'));
  const ai=h.findIndex(x=>x.includes('ご利用金額'));
  const di=h.findIndex(x=>x.includes('ご利用日'));
  if(si<0||ai<0) return null;
  const persons=[]; let cur=null;
  for (let i=1;i<rows.length;i++) {
    const r=rows[i];
    const store=(r[si]||'').trim(), amts=(r[ai]||'').trim(), date=(r[di]||'').trim();
    const nm=store.match(/【(.+?)様】/);
    if(nm){cur={name:nm[1].replace(/\u3000/g,' ').trim(),transactions:[],total:0};persons.push(cur);continue;}
    if(cur&&amts){const a=parseAmt(amts);if(!isNaN(a)){cur.transactions.push({store,amount:a,date});cur.total+=a;}}
  }
  return {month:parseMonth(fn),persons,filename:fn};
}

function fmt(n){return(n<0?'−':'')+Math.abs(n).toLocaleString('ja-JP')+'円';}
function initials(name){const p=name.replace(/\s+/g,' ').trim().split(' ');return p.length>=2?p[0][0]+p[1][0]:name.slice(0,2);}

let allData=[], activeMonth=null, selectedPerson={}, currentView='months';
let filters={query:'',sort:'date-desc'};
let statusMessage='';
let queryComposing=false;
let period={start:'',end:''};

function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function enc(value){return encodeURIComponent(String(value??''));}
function compactAmt(n){return Math.abs(n)>=10000?`${Math.round(n/10000)}万円`:fmt(n);}
function monthLabel(m){return m.month.replace('年','/').replace('月','');}
function allTransactions(){return allData.flatMap(m=>m.persons.flatMap(p=>p.transactions.map(tx=>({...tx,name:p.name,filename:m.filename,month:m.month}))));}
function matches(tx){const q=filters.query.trim().toLowerCase();const inPeriod=(!period.start||tx.filename>=period.start)&&(!period.end||tx.filename<=period.end);return inPeriod&&(!q||[tx.store,tx.name,tx.date,tx.month].some(v=>String(v||'').toLowerCase().includes(q)));}
function dateValue(value){const m=String(value||'').match(/(\d{4})年(\d{1,2})月(?:\d{1,2}日)?/);return m?Number(m[1])*10000+Number(m[2])*100+(Number((String(value||'').match(/月(\d{1,2})日/)||[])[1])||0):0;}
function sortTransactions(items){return [...items].sort((a,b)=>{if(filters.sort==='amount-desc')return b.amount-a.amount;if(filters.sort==='amount-asc')return a.amount-b.amount;if(filters.sort==='store')return String(a.store).localeCompare(String(b.store),'ja');const order=dateValue(a.date||a.month)-dateValue(b.date||b.month);return filters.sort==='date-asc'?order:-order;});}
function visibleTransactions(p,m){return sortTransactions(p.transactions.map(tx=>({...tx,name:p.name,filename:m.filename,month:m.month})).filter(matches));}
const sortOptions=[['date-desc','日付が新しい順'],['date-asc','日付が古い順'],['amount-desc','金額が大きい順'],['amount-asc','金額が小さい順'],['store','利用先名順']];
let sortMenuOpen=false;
function formatToolbar(){
  const sortLabel=sortOptions.find(([value])=>value===filters.sort)?.[1]||sortOptions[0][1];
  const options=sortOptions.map(([value,label])=>`<button class="sort-option${filters.sort===value?' selected':''}" onclick="chooseSort('${value}')"><span>${label}</span>${filters.sort===value?'<span class="sort-option-check">✓</span>':''}</button>`).join('');
  const startOptions=allData.map(m=>`<option value="${esc(m.filename)}"${period.start===m.filename?' selected':''}>${esc(m.month)}</option>`).join('');
  const endOptions=allData.map(m=>`<option value="${esc(m.filename)}"${period.end===m.filename?' selected':''}>${esc(m.month)}</option>`).join('');
  return `<div class="toolbar"><input id="searchInput" type="search" placeholder="利用先・名前・日付で検索" value="${esc(filters.query)}" oncompositionstart="queryComposing=true" oncompositionend="finishQuery(this.value)" oninput="updateQuery(this.value, event)" onchange="finishQuery(this.value)" onkeyup="if(event.key==='Enter') finishQuery(this.value)"><div class="sort-menu${sortMenuOpen?' open':''}"><button class="sort-trigger" aria-expanded="${sortMenuOpen}" onclick="toggleSortMenu(event)"><span class="sort-trigger-label">${sortLabel}</span><span class="sort-trigger-icon">⌄</span></button><div class="sort-options" role="menu">${options}</div></div><div class="period-filter"><span>期間</span><select onchange="updatePeriod('start',this.value)" aria-label="開始月"><option value="">開始月</option>${startOptions}</select><span>〜</span><select onchange="updatePeriod('end',this.value)" aria-label="終了月"><option value="">終了月</option>${endOptions}</select></div><div class="view-tabs"><button class="view-tab${currentView==='months'?' active':''}" onclick="switchView('months')">月別明細</button><button class="view-tab${currentView==='analysis'?' active':''}" onclick="switchView('analysis')">全期間分析</button></div></div>${statusMessage?`<div class="status-message">${esc(statusMessage)}</div>`:''}`;
}

function renderAnalysis(){
  const tx=sortTransactions(allTransactions().filter(matches));
  const total=tx.reduce((sum,item)=>sum+item.amount,0);
  const months=allData.map(m=>{const items=tx.filter(item=>item.filename===m.filename);return {...m,total:items.reduce((sum,item)=>sum+item.amount,0),count:items.length};}).filter(m=>m.count);
  const max=Math.max(...months.map(m=>Math.abs(m.total)),1);
  const storeMap={};tx.forEach(item=>{const key=item.store||'（利用先不明）';if(!storeMap[key])storeMap[key]={name:key,total:0,count:0};storeMap[key].total+=item.amount;storeMap[key].count++;});
  const stores=Object.values(storeMap).sort((a,b)=>b.total-a.total).slice(0,8);
  const names=[...new Set(tx.map(item=>item.name))];
  let html='<div class="analysis-view active"><div class="analysis-summary"><div class="metric-card"><div class="metric-label">全期間の合計</div><div class="metric-value">'+fmt(total)+'</div></div><div class="metric-card"><div class="metric-label">利用件数</div><div class="metric-value">'+tx.length.toLocaleString('ja-JP')+'件</div></div><div class="metric-card"><div class="metric-label">月平均</div><div class="metric-value">'+fmt(months.length?Math.round(total/months.length):0)+'</div></div></div><div class="analysis-grid"><section class="analysis-card"><h2>月別合計</h2>';
  if(!months.length)html+='<div class="empty-state">条件に一致する明細がありません</div>';else{html+='<div class="bar-chart">';months.forEach(m=>{const h=Math.max(Math.round(Math.abs(m.total)/max*135),3);html+=`<div class="bar-column"><div class="bar-value">${compactAmt(m.total)}</div><div class="bar" style="height:${h}px" title="${esc(m.month)} ${fmt(m.total)}"></div><div class="bar-label">${esc(monthLabel(m))}</div></div>`;});html+='</div>';}
  html+='</section><section class="analysis-card"><h2>利用先ランキング</h2>';
  if(!stores.length)html+='<div class="empty-state">条件に一致する明細がありません</div>';else{html+='<div class="ranking-list">';stores.forEach((store,i)=>{const width=Math.max(Math.round(store.total/stores[0].total*100),2);html+=`<div class="ranking-row"><div class="ranking-rank">${i+1}</div><div class="ranking-main"><div class="ranking-name" title="${esc(store.name)}">${esc(store.name)} <span style="color:var(--text3)">${store.count}件</span></div><div class="ranking-bar-track"><div class="ranking-bar-fill" style="width:${width}%"></div></div></div><div class="ranking-amount">${fmt(store.total)}</div></div>`;});html+='</div>';}
  html+='</section><section class="analysis-card analysis-card-wide"><h2>前月比</h2>';
  if(!months.length)html+='<div class="empty-state">条件に一致する明細がありません</div>';else{html+='<div style="overflow:hidden"><table class="comparison-table"><thead><tr><th>月</th><th>合計</th><th>前月差</th><th>増減率</th></tr></thead><tbody>';months.forEach((m,i)=>{const prev=months[i-1],diff=prev?m.total-prev.total:null,rate=prev&&prev.total?`${((diff/Math.abs(prev.total))*100).toFixed(1)}%`:'—';html+=`<tr><td>${esc(m.month)}</td><td>${fmt(m.total)}</td><td class="${diff>0?'comparison-up':diff<0?'comparison-down':''}">${diff===null?'—':fmt(diff)}</td><td class="${diff>0?'comparison-up':diff<0?'comparison-down':''}">${rate}</td></tr>`;});html+='</tbody></table></div>';}
  html+='</section><section class="analysis-card analysis-card-wide"><h2>名前別の月別推移</h2>';
  if(!names.length)html+='<div class="empty-state">条件に一致する明細がありません</div>';else{html+='<div style="overflow:hidden"><table class="trend-table"><thead><tr><th>名前</th>';months.forEach(m=>html+=`<th>${esc(monthLabel(m))}</th>`);html+='</tr></thead><tbody>';names.forEach(name=>{html+=`<tr><td>${esc(name)}</td>`;months.forEach(m=>{const sum=tx.filter(item=>item.name===name&&item.filename===m.filename).reduce((s,item)=>s+item.amount,0);html+=`<td>${fmt(sum)}</td>`;});html+='</tr>';});html+='</tbody></table></div>';}
  html+='</section><section class="analysis-card analysis-card-wide"><h2>人別の精算目安（均等割り）</h2>';
  if(!names.length)html+='<div class="empty-state">条件に一致する明細がありません</div>';else{const equal=total/names.length;html+=`<div class="metric-label" style="margin-bottom:8px">1人あたりの均等負担額：${fmt(Math.round(equal))}</div><div style="overflow:hidden"><table class="settlement-table"><thead><tr><th>名前</th><th>利用額</th><th>全体比</th><th>均等割りとの差額</th></tr></thead><tbody>`;names.forEach(name=>{const amount=tx.filter(item=>item.name===name).reduce((s,item)=>s+item.amount,0),diff=amount-equal;html+=`<tr><td>${esc(name)}</td><td>${fmt(amount)}</td><td>${total?((amount/total)*100).toFixed(1):'0.0'}%</td><td class="${diff>=0?'comparison-up':'comparison-down'}">${fmt(diff)}</td></tr>`;});html+='</tbody></table></div>';}
  return html+'</section></div></div>';
}

function renderMonthViews(){
  let html='';if(allData.length>1){html+='<div class="month-tabs">';allData.forEach(m=>html+=`<button class="month-tab${m.filename===activeMonth?' active':''}" onclick="switchMonth('${enc(m.filename)}')">${esc(m.month)}</button>`);html+='</div>';}
  const active=allData.find(m=>m.filename===activeMonth)||allData.at(-1);if(!active)return html;
  const names=[...new Set(allData.flatMap(m=>m.persons.map(p=>p.name)))],colorMap={};names.forEach((n,i)=>colorMap[n]=COLORS[i%COLORS.length]);
  const people=active.persons.map(p=>{const transactions=visibleTransactions(p,active);return {...p,transactions,total:transactions.reduce((s,tx)=>s+tx.amount,0)};}).filter(p=>p.transactions.length);
  const selected=selectedPerson[active.filename]||(people[0]&&people[0].name),grand=people.reduce((s,p)=>s+p.total,0);
  html+=`<div class="month-view active"><div class="total-banner"><div class="grand-total"><div class="grand-total-label">${esc(active.month)}の合計金額</div><div class="grand-total-amount">${fmt(grand)}</div></div><div class="total-banner-label">名前別の合計</div><div class="total-banner-grid">`;
  if(!people.length)html+='<div class="empty-state">条件に一致する明細がありません</div>';
  people.forEach(p=>{const c=colorMap[p.name];html+=`<div class="total-chip${p.name===selected?' selected':''}" onclick="selectPerson('${enc(active.filename)}','${enc(p.name)}')" style="background:${c.bg};border:1px solid ${c.border};"><div class="total-chip-name" style="color:${c.text};">${esc(p.name)}</div><div class="total-chip-amount" style="color:${c.text};">${fmt(p.total)}</div></div>`;});
  html+='</div></div><div class="person-cards-grid">';
  people.forEach(p=>{const c=colorMap[p.name];html+=`<div class="person-card${p.name===selected?' selected':''}"><div class="person-header"><div class="person-header-left"><div class="person-avatar" style="background:${c.avatarBg};color:${c.avatarText};">${esc(initials(p.name))}</div><div><div class="person-name">${esc(p.name)}</div><div class="person-count">${p.transactions.length}件の利用</div></div></div><div class="person-total" style="color:${c.text};">${fmt(p.total)}</div></div><div class="tx-list"><div class="tx-list-inner">`;p.transactions.forEach(tx=>{const date=tx.date?esc(tx.date.replace('年','/').replace('月','/').replace('日','')):'';html+=`<div class="tx-row"><div style="min-width:0;flex:1"><div class="tx-store" title="${esc(tx.store)}">${esc(tx.store)}</div>${date?`<div class="tx-date">${date}</div>`:''}</div><div class="tx-amount${tx.amount<0?' negative':''}">${fmt(tx.amount)}</div></div>`;});html+='</div></div></div>';});
  return html+'</div></div>';
}

function render(){const app=document.getElementById('app'),dz=document.getElementById('dropzone'),buttons=document.getElementById('header-buttons');if(!allData.length){app.classList.remove('visible');app.innerHTML='';dz.classList.remove('hidden');buttons.style.display='none';return;}dz.classList.add('hidden');app.classList.add('visible');buttons.style.display='flex';app.innerHTML=formatToolbar()+(currentView==='analysis'?renderAnalysis():renderMonthViews());}

function updateQuery(value,event){filters.query=value;if(queryComposing||event?.isComposing)return;render();const input=document.getElementById('searchInput');if(input){input.focus();input.setSelectionRange(value.length,value.length);}}
function finishQuery(value){queryComposing=false;setTimeout(()=>{const input=document.getElementById('searchInput');const latest=input?input.value:value;filters.query=latest;render();const nextInput=document.getElementById('searchInput');if(nextInput){nextInput.focus();nextInput.setSelectionRange(latest.length,latest.length);}},0);}
function updateSort(value){filters.sort=value;render();}
function updatePeriod(which,value){period[which]=value;if(period.start&&period.end&&period.start>period.end){if(which==='start')period.end=value;else period.start=value;}render();}
function toggleSortMenu(event){event.stopPropagation();sortMenuOpen=!sortMenuOpen;render();}
function chooseSort(value){filters.sort=value;sortMenuOpen=false;render();}
function switchView(view){currentView=view;render();}
function switchMonth(fn){activeMonth=decodeURIComponent(fn);render();}
function selectPerson(fn,name){selectedPerson[decodeURIComponent(fn)]=decodeURIComponent(name);render();}
function resetAll(){allData=[];activeMonth=null;selectedPerson={};currentView='months';filters={query:'',sort:'date-desc'};period={start:'',end:''};statusMessage='';render();}

async function handleFiles(files) {
  const csvFiles=Array.from(files||[]).filter(file=>/\.csv$/i.test(file.name));
  if(!csvFiles.length){alert('CSVファイルを選択してください');return;}
  statusMessage=`${csvFiles.length}件のCSVを読み込み中…`;render();
  const res=[];
  for(const file of csvFiles){const data=processCSV(decodeFile(await file.arrayBuffer()),file.name);if(data)res.push(data);}
  if(!res.length){statusMessage='有効なCSVファイルが見つかりませんでした';render();return;}
  res.forEach(d=>{
    const i=allData.findIndex(x=>x.filename===d.filename);
    if(i>=0)allData[i]=d; else allData.push(d);
  });
  allData.sort((a,b)=>a.filename.localeCompare(b.filename));
  if (!activeMonth||!allData.find(d=>d.filename===activeMonth)) activeMonth=allData[allData.length-1].filename;
  statusMessage=`${res.length}件のCSVを読み込みました`;
  render();
}

const dz=document.getElementById('dropzone');
const fi=document.getElementById('fileInput');
document.addEventListener('click',event=>{if(sortMenuOpen&&!event.target.closest('.sort-menu')){sortMenuOpen=false;render();}});
fi.addEventListener('change',()=>handleFiles(fi.files));
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');handleFiles(e.dataTransfer.files);});
</script>
</body>
